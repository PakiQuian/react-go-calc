# Brings up the full stack: http://localhost:3000
#
# Two containers, matching the two deployables the assignment describes. Only
# the web container publishes a port; the API is reachable through nginx, which
# is what keeps the browser on a single origin.
name: react-go-calc

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      PORT: 8080
    restart: unless-stopped
    # Arbitrary-precision arithmetic has no inherent ceiling, so the operand
    # bounds are the real defence — this caps the blast radius if one is ever
    # missed, keeping a bad request from reaching host memory.
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    # No ports section: the API is deliberately not exposed to the host.

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
