server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A calculation request is a few dozen bytes. The Go service applies its
    # own limit as well: this one just rejects oversized bodies earlier.
    client_max_body_size 8k;

    # "api" is the compose service name, resolved by Docker's internal DNS.
    # The Go container publishes no port to the host — it is reachable only
    # through this proxy.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page application: unknown paths return index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
